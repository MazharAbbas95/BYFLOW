services:
  - type: web
    name: byflow-api
    runtime: node
    rootDir: .
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: byflow-db
          property: connectionString
      - key: CLIENT_URL
        value: https://byflow.onrender.com

databases:
  - name: byflow-db
    databaseName: bayflow
    plan: free
